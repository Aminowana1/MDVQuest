name: MDVQuest
version: 1.4.5
main: com.mdvcraft.mdvquest.MDVQuestPlugin
api-version: '1.21'
author: MDVCRAFT
website: https://mdvcraft.xyz
softdepend:
  - MDVSocial
  - MDVRecetas
  - MDVHeadOres
  - MMOItems
  - MMOCore
  - MythicMobs
  - PlaceholderAPI
  - MDVClans
  - floodgate
commands:
  mdvquest:
    description: Abre y administra las misiones rotativas.
    usage: /mdvquest
    aliases: [misiones, quests, quest]
permissions:
  mdvquest.use:
    description: Permite consultar el progreso de las misiones y usar sus menús.
    default: true
  mdvquest.admin:
    description: Permite recargar, administrar y reportar progreso manualmente.
    default: op
    children:
      mdvquest.editor: true
      mdvquest.admin.reroll: true
      mdvquest.admin.force: true
      mdvquest.admin.open-interactive: true
  mdvquest.editor:
    description: Permite usar el catálogo y editor visual de misiones sin comandos técnicos.
    default: op
  mdvquest.admin.reroll:
    description: Permite regenerar una o todas las rotaciones globales.
    default: op
  mdvquest.admin.force:
    description: Permite añadir una misión concreta a su rotación global actual sin borrar progreso.
    default: op
  mdvquest.admin.open-interactive:
    description: Permite abrir el menú interactivo completo para uno mismo u otro jugador.
    default: op
  mdvquest.access.vip1:
    description: Permite aceptar y reclamar instancias VIP1.
    default: false
  mdvquest.access.vip2:
    description: Permite aceptar y reclamar instancias VIP2.
    default: false

  mdvquest.contract-limit.one-day.3:
    description: Ejemplo de límite de contratos diarios. Los valores se leen dinámicamente.
    default: false
  mdvquest.contract-limit.two-three-days.2:
    description: Ejemplo de límite de contratos de 2 a 3 días.
    default: false
  mdvquest.contract-limit.four-six-days.1:
    description: Ejemplo de límite de contratos de 4 a 6 días.
    default: false
  mdvquest.contract-limit.seven-days.1:
    description: Ejemplo de límite de contratos semanales.
    default: false
