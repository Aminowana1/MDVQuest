# ==========================================================
# MDVQuest 1.4.5 - VISUALIZADOR DE CONTRATOS PARA BEDROCK
#
# Solo se usa con jugadores Floodgate/Bedrock cuando abren
# /quest, /quests, /misiones o /mdvquest.
# Los jugadores Java conservan el inventario original.
# ==========================================================

type: "DYNAMIC_QUEST_VIEWER"
back-command: "social"

states:
  available: "&fDisponible"
  accepted: "&eEn progreso"
  completed: "&aCompletada"
  claimed: "&8Reclamada"
  locked: "&cBloqueada"

category:
  title: "&8&lMis Contratos"
  content:
    - "&7Consulta el progreso de los contratos"
    - "&7que ya has aceptado."
    - ""
    - "&8Selecciona una duración."

  categories:
    one-day:
      text: "&e&lMisiones diarias\n&r&7Aceptados: &f{accepted}/{limit} &8• &7Completados: &a{completed}"
    two-three-days:
      text: "&6&lMisiones de 2 a 3 días\n&r&7Aceptados: &f{accepted}/{limit} &8• &7Completados: &a{completed}"
    four-six-days:
      text: "&2&lMisiones de 4 a 6 días\n&r&7Aceptados: &f{accepted}/{limit} &8• &7Completados: &a{completed}"
    seven-days:
      text: "&9&lMisiones semanales\n&r&7Aceptados: &f{accepted}/{limit} &8• &7Completados: &a{completed}"

  back:
    text: "&6&lVolver\n&r&8Regresa al menú social."

mission-list:
  title: "&8&l{category}"
  # En celular se reduce el número de contratos por página.
  page-size: 6
  mobile-page-size: 5
  content:
    - "&7Contratos aceptados: &f{accepted}/{limit}"
    - "&7Página: &f{page}/{pages}"
    - ""
    - "&8Toca un contrato para ver su progreso."
  empty: "&7No tienes contratos aceptados en esta categoría."

  mission:
    accepted: "&e&l{mission}\n&r&7Progreso: &f{objectives_done}/{objectives_total} &8• &7{remaining}"
    completed: "&a&l{mission}\n&r&aCompletada &8• &7Visita al encargado para reclamar"
    claimed: "&8&l{mission}\n&r&7Recompensa ya reclamada"
    locked: "&b&l{mission}\n&r&cRequiere {rank}"
    available: "&f&l{mission}"

  previous:
    text: "&ePágina anterior"
  next:
    text: "&aPágina siguiente"
  back:
    text: "&6Volver a categorías"

detail:
  title: "&8&l{mission_plain}"
  no-description: "&8Sin descripción adicional."
  content:
    - "&7Estado: {state}"
    - "&7Expira en: &f{remaining}"
    - ""
    - "&e&l● Descripción"
    - "{description}"
    - ""
    - "&e&l● Objetivos"
    - "{objectives}"
    - ""
    - "&a&l● Recompensas"
    - "{rewards}"

  objectives:
    complete-icon: "&a✔"
    pending-icon: "&7•"
    complete-format: "{icon} &f{objective} &7(&a{progress}&7/{required})"
    pending-format: "{icon} &f{objective} &7({progress}/{required})"
    delivery-format: "{icon} &f{objective} &7({progress}/{required}) &6[Entrega]"
    empty: "&7Sin objetivos."

  rewards:
    experience-format: "&7• &b{amount} EXP &f{target}"
    vanilla-format: "&7• &f{amount}x {item}"
    mmoitem-format: "&7• &d{amount}x {item}"
    mythic-item-format: "&7• &5{amount}x {item}"
    exact-item-format: "&7• &f{amount}x {item}"
    empty: "&7• Sin recompensa configurada"

  actions:
    back:
      text: "&6&lVolver\n&r&8Regresa a tus contratos."
